note: >-
  OpenBao publishes NO MCP server. The openbao GitHub organisation contains no MCP repository, the
  documentation site has no MCP page, and a GitHub search for "openbao mcp" returns only unaffiliated
  third-party projects (Knuckles-Team/openbao-mcp, Nathan-E-White/openbao-codex-plugin,
  papastanb/Bao_MCP, shbert/mcp-vault), all at zero stars and none published by the project. Those are
  deliberately not recorded as OpenBao surfaces. The tools[] below are a DERIVED candidate list from
  the project's own published HTTP API reference - they describe what an MCP server over OpenBao would
  expose, and no such server exists today.
  A further consideration for anyone building one: OpenBao's own AGENTS.md (see skills/) instructs
  agents that AI-generated contributions to the project are rejected. That governs contributions to
  the repository, not calling a running OpenBao instance, but it is the project's stated posture on
  agents and belongs next to any MCP work.
