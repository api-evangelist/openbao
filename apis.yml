aid: openbao
name: OpenBao
description: >-
  OpenBao is an open source, community-driven identity-based secrets and encryption management
  system, forked from HashiCorp Vault in 2023 and governed by the Linux Foundation as a sandbox
  project of the Open Source Security Foundation (OpenSSF). It stores and tightly controls access
  to tokens, passwords, certificates and encryption keys, and exposes every one of its capabilities
  — key/value secrets, dynamic database credentials, PKI issuance, transit encryption, leasing and
  revocation, policy and namespace administration, seal/unseal and cluster operations — through a
  single JSON HTTP API prefixed with /v1/. OpenBao is self-hosted software rather than a hosted
  service, so there is no vendor-operated base URL: the API is served by whatever instance an
  operator runs, and the CLI, the web UI and the official Go client all speak the same HTTP API.
  The machine-readable OpenAPI document is generated per instance at runtime from the mounted
  backends and is served at /v1/sys/internal/specs/openapi rather than published as a static file.
