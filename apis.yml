apis:
- aid: openbao-http-api
  name: OpenBao HTTP API
  description: >-
    The OpenBao HTTP API gives full access to every OpenBao capability over REST-like HTTP verbs.
    All routes are prefixed with /v1/ and the API is versioned only at that prefix. Authentication
    is by client token, supplied either in the X-Vault-Token header or as an Authorization Bearer
    token; each auth method additionally exposes unauthenticated login endpoints. Namespaces are
    selected with the X-Vault-Namespace header or by full path. Requests and responses are JSON,
    LIST is used as an HTTP verb alongside GET/POST/PUT/PATCH/DELETE, and errors are returned in a
    common {"errors": [...]} envelope for any status >= 400.
  humanURL: https://openbao.org/docs/api/
  baseURL: https://{bao_address}/v1
  x-base-url-note: >-
    TEMPLATED ON PURPOSE - do not "repair" this to a concrete host. OpenBao is self-hosted software
    with no vendor-operated API endpoint, so there is no base URL for the project to publish and it
    publishes none. Its own documentation uses http://127.0.0.1:8200/v1 throughout, which is a local
    dev-mode instance rather than a service. {bao_address} is the address of whatever instance the
    operator runs, named after the BAO_ADDR environment variable the CLI and docs use.
    repair-api-bases.py reports verdict no-usable-base for this repo; that verdict is expected here
    and is a property of the delivery model, not a gap in the profile.
  tags:
  - Secrets Management
  - Security
  - Encryption
  - PKI
