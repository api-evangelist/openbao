- version: 2.6.2
  date: '2026-08-18'
  breaking: false
  security: true
  highlights:
  - 'SECURITY: internal operation types can no longer be dispatched from inline authentication and workflows, which had allowed token creation (GHSA-rh46-vc3j-w2w3).'
  - 'SECURITY: secrets/pki now enforces allowed_ip_sans_cidr on IP SANs taken from CSRs (GHSA-g892-p242-8g86).'
  - 'sys/leases: renew, revoke and revoke-prefix now propagate to the active node by default.'
  - 'sys/quotas: fixed the broken enable_rate_limit_audit_logging option.'
- version: 2.6.1
  date: '2026-07-22'
  breaking: false
  security: false
  highlights:
  - 'core/policies: PATCH support for modifying individual policy parameters.'
  - 'core/policies: fixed limit=0 and negative limits bypassing the pagination_limit ACL option.'
  - 'packaging/container: reverted removal of legacy non-OCI image labels for compatibility.'
- version: 2.6.0
  date: '2026-07-14'
  breaking: false
  security: true
  additions: true
  highlights:
  - 'Namespace Sealing - Shamir seal configuration per namespace, partitioning tenant storage with distinct key material.'
  - 'Auto Unseal plugins - a new kms plugin type, so unseal mechanisms ship as external binaries; several provider-specific built-in seals are announced for removal in v2.7.0.'
  - 'Workflows - new sys/workflows endpoints letting operators define simplified managed interfaces over the standard API, optionally executable unauthenticated.'
  - 'Authenticated root generation - /sys/generate-root-token replaces the deprecated unauthenticated endpoints.'
  - 'Distroless container images published as openbao-distroless.'
