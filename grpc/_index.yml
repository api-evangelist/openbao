name: OpenBao Protobuf / gRPC contracts
note: >-
  These are the gRPC service contracts OpenBao publishes in its own source tree. They describe the
  PLUGIN and CLUSTER RPC surfaces — how an external secrets/auth/database/KMS plugin talks to an
  OpenBao core, and how a standby node forwards a request to the active node — not the /v1/ HTTP
  API that end users call. They are saved verbatim, unmodified, from the openbao/openbao repository
  default branch. Anyone writing an OpenBao plugin codes against these.
license: MPL-2.0
