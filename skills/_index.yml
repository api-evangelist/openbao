summary: >-
  OpenBao publishes an AGENTS.md at the root of its main repository. It is saved here verbatim,
  unmodified. It is a POLICY document rather than a packaged operating skill, and it is worth reading
  before pointing any agent at this project, because it is one of the most restrictive agent postures
  in the catalog: the project rejects all AI-generated contributions outright, requires a robot emoji
  on the title of any pull request opened by an agent, and permits AI only as an assistant for finding
  security issues, answering questions and translating text a person wrote. Its security-report
  section is genuinely useful guidance - a functional reproducer is mandatory, source snippets should
  be minimised in favour of reproducers, and reports must target supported versions.
