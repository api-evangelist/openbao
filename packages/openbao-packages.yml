name: OpenBao packages and client libraries
note: >-
  OpenBao ships ONE official client library - the Go client, versioned as a submodule of the main
  repository. Its own docs say so explicitly and add that OpenBao intends to remain API-compatible
  with HashiCorp Vault, so existing Vault client libraries in other languages are expected to work;
  those are third-party and are not counted as OpenBao SDKs here. The rest of the distribution
  surface is the server itself - Homebrew, FreeBSD pkg, Arch, EPEL/Fedora, Debian/Ubuntu/Amazon
  Linux repos at pkgs.openbao.org, and container images on ghcr.io, quay.io and docker.io.
